name: Build Application

on:
  push:
    tags:
      - 'v*'            # e.g. git tag v1.0.1 && git push --tags
  workflow_dispatch:    # or run manually from the Actions tab

permissions:
  contents: write       # needed so the release step can upload files

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one OS failing shouldn't cancel the others
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean SearchGlossary.spec

      # Zipping differs per OS: PowerShell on Windows, and macOS needs
      # ditto rather than zip to preserve the symlinks inside a .app.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path SearchGlossary -DestinationPath SearchGlossary-Windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent SearchGlossary.app SearchGlossary-macOS.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf SearchGlossary-Linux.tar.gz SearchGlossary

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.label }}
          path: |
            dist/SearchGlossary-Windows.zip
            dist/SearchGlossary-macOS.zip
            dist/SearchGlossary-Linux.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true      # flatten into one folder

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
